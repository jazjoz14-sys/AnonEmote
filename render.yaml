# Render blueprint for the AnonEmote backend.
#
# Render can read this automatically, or you can create the service manually
# using the same settings. Secrets are marked sync:false so they are never
# stored in the repository — set their values in the Render dashboard.

services:
  - type: web
    name: anonemote-api
    runtime: node
    plan: free
    region: singapore          # closest to PH users; must match your Supabase region ideally
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 20

      # Render assigns PORT automatically; the app reads process.env.PORT
      - key: PORT
        value: 10000

      # ── Secrets — set these in the Render dashboard, not here ────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PERSPECTIVE_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REPORT_HASH_SECRET
        sync: false

      # Must match your deployed frontend origin exactly (no trailing slash)
      - key: CORS_ORIGIN
        sync: false
